[server]
address = "127.0.0.1:9090"
token = "rvn_dev_token"
tls = false
# Optional when tls=true
# tls_domain_name = "raven.local"
# tls_ca_cert_path = "/etc/raven/certs/ca.pem"

[metrics]
interval_seconds = 10

[transport]
batch_size = 100
flush_interval_seconds = 5
retry_max_interval_seconds = 60
wal_max_size_mb = 100
heartbeat_interval_seconds = 30
channel_capacity = 256

[logging]
level = "info"
service_name = "raven-agent"

[[logs]]
name = "app-out"
path = "/tmp/raven-log-reader/app-out.log"
format = "plain"
stream = "stdout"

[[logs]]
name = "app-error"
path = "/tmp/raven-log-reader/app-error.log"
format = "plain"
stream = "stderr"

[[logs]]
name = "docker-json"
path = "/tmp/raven-log-reader/docker-json.log"
format = "docker-json"
