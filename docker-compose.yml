services:
  raven-server:
    image: ghcr.io/rvnhq/raven-server:${RAVEN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${RAVEN_HTTP_PORT:-8080}:8080"
      - "${RAVEN_GRPC_PORT:-9090}:9090"
    environment:
      RUST_LOG: ${RUST_LOG:-raven_server=info}
    volumes:
      - ${RAVEN_DATA_DIR:-/var/lib/raven}:/var/lib/raven
      - ${RAVEN_CONFIG_PATH:-/etc/raven/server.toml}:/etc/raven/server.toml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz || exit 1"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 12
    #   start_period: 20s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.137.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
    volumes:
      - vm-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health | grep -qi ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: raven
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  vm-data:
  ch-data:
