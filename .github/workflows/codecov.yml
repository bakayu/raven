name: codecov

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_VERSION: 0.8.6
  SQLX_FEATURES: "sqlite"
  DATABASE_URL: "sqlite://./.ci/sqlx-ci.db"

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.2-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      victoriametrics:
        image: victoriametrics/victoria-metrics:v1.104.0
        ports:
          - 8428:8428
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --version "${{ env.SQLX_VERSION }}" \
            --no-default-features \
            --features "${{ env.SQLX_FEATURES }}" \
            --locked

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Prepare SQLx database for query macros
        run: |
          mkdir -p .ci
          rm -f .ci/sqlx-ci.db
          sqlx database create
          sqlx migrate run --source crates/raven-server/migrations

      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Wait for ClickHouse + VictoriaMetrics
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8123/ping && break || sleep 1
          done
          for i in {1..30}; do
            curl -fsS http://localhost:8428/-/ready && break || sleep 1
          done

      - name: Generate code coverage
        env:
          RAVEN_DATABASE__CLICKHOUSE_URL: "http://localhost:8123"
          RAVEN_DATABASE__VICTORIA_METRICS_URL: "http://localhost:8428"
        run: cargo tarpaulin --verbose --workspace --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: true
