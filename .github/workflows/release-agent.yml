name: release-agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-assets:
    name: Build Agent Assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build raven-agent (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release -p raven-agent --target ${{ matrix.target }}

      - name: Build raven-agent (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
            CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
            AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release -p raven-agent --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/raven-agent dist/raven-agent-${{ matrix.target }}
          chmod +x dist/raven-agent-${{ matrix.target }}

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: raven-agent-${{ matrix.target }}
          path: dist/raven-agent-${{ matrix.target }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
            pattern: raven-agent-*
            path: dist
            merge-multiple: true

      - name: Add installer and config template
        run: |
          cp scripts/install_release.sh dist/install.sh
          cp config/agent.toml.template dist/agent.toml.template
          cp scripts/install-server.sh dist/install-server.sh
          cp config/server.toml.template dist/server.toml.template
          cp docker-compose.yml dist/docker-compose.yml
          chmod +x dist/install.sh
          chmod +x dist/install-server.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum raven-agent-* install.sh agent.toml.template install-server.sh server.toml.template docker-compose.yml > checksums.txt

      - name: Detect prerelease channel
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-alpha."* || "$TAG" == *"-beta."* || "$TAG" == *"-rc."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            dist/raven-agent-x86_64-unknown-linux-gnu
            dist/raven-agent-aarch64-unknown-linux-gnu
            dist/install.sh
            dist/agent.toml.template
            dist/install-server.sh
            dist/server.toml.template
            dist/docker-compose.yml
            dist/checksums.txt

  build-server-image:
    name: Build and Push Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/rvnhq/raven-server"
          if [[ "$TAG" == *"-alpha."* || "$TAG" == *"-beta."* || "$TAG" == *"-rc."* ]]; then
            echo "tags=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
