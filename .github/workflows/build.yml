name: build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_VERSION: 0.8.6
  SQLX_FEATURES: "sqlite"  
  DATABASE_URL: "sqlite://./.ci/sqlx-ci.db"

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli \
            --version "${{ env.SQLX_VERSION }}" \
            --no-default-features \
            --features "${{ env.SQLX_FEATURES }}" \
            --locked

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Prepare SQLx database for query macros
        run: |
          mkdir -p .ci
          rm -f .ci/sqlx-ci.db
          sqlx database create
          sqlx migrate run --source crates/raven-server/migrations

      - name: cargo build
        run: cargo build --all

      - name: cargo test
        run: cargo test --all
